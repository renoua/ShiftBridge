# Build macOS uniquement : Windows et Android restent compilés en local (voir README).
# Une release publiée (gh release create vX.Y.Z …) déclenche la compilation du DMG, qui est ajouté à cette même release
# sous le nom attendu par la recherche de mises à jour Mac : ShiftBridge-macos-arm64.dmg.
# Sans compte Apple Developer, le DMG n'est signé qu'ad hoc (pas notarisé) : au premier lancement, clic droit → Ouvrir.
name: macos

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release à compléter (ex. v0.23.0) ; vide = simple artefact"
        required: false

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Workload macOS
        run: dotnet workload install macos

      # Le pack Microsoft.macOS.Sdk.<tfm>_<X.Y> est compilé pour Xcode X.Y : un Xcode plus récent du runner
      # (ex. 26.6 pour un pack 26.0) ne fournit pas le SDK attendu (« SDK … cannot be located », install_name_tool introuvable).
      # On prend donc l'Xcode X.Y le plus récent, sinon le plus proche inférieur, sinon celui par défaut du runner.
      - name: Xcode correspondant au workload
        run: |
          # Le runner peut contenir des packs d'autres versions de .NET (ex. net11.0_27.2) : on ne garde que celui du projet.
          tfm="$(sed -n 's|.*<TargetFramework>\(net[0-9.]*\)-macos</TargetFramework>.*|\1|p' src/ShiftBridge.MacOS/ShiftBridge.MacOS.csproj)"
          pack="$(ls -d "${DOTNET_ROOT:-$HOME/.dotnet}"/packs/Microsoft.macOS.Sdk."$tfm"_* | sort -V | tail -1)"
          [ -n "$tfm" ] && [ -n "$pack" ] || { echo "::error::Pack Microsoft.macOS.Sdk introuvable pour '$tfm'"; exit 1; }
          want="${pack##*_}"
          echo "Pack : $pack → Xcode $want attendu"
          echo "Xcode disponibles :"; ls -d /Applications/Xcode_*.app
          xcode=""
          for app in $(ls -d /Applications/Xcode_*.app | grep -vi beta); do
            v="$(basename "$app" .app)"; v="${v#Xcode_}"
            if [ "$(printf '%s\n%s.999\n' "$v" "$want" | sort -V | tail -1)" = "$want.999" ]; then
              if [ -z "$xcode" ] || [ "$(printf '%s\n%s\n' "$v" "$best" | sort -V | tail -1)" = "$v" ]; then
                xcode="$app"; best="$v"
              fi
            fi
          done
          if [ -n "$xcode" ]; then
            echo "Xcode choisi : $xcode"
            sudo xcode-select -s "$xcode"
          else
            echo "::warning::Aucun Xcode <= $want trouvé, Xcode par défaut conservé"
          fi
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path
          xcrun -f install_name_tool

      - name: Tests
        run: dotnet test tests/ShiftBridge.Core.Tests -c Release

      # ValidateXcodeVersion=false : l'Xcode choisi ci-dessus peut différer du workload d'un correctif (ex. 26.0.1 au lieu de 26.0).
      - name: Compilation
        run: dotnet build src/ShiftBridge.MacOS/ShiftBridge.MacOS.csproj -c Release -p:ValidateXcodeVersion=false

      - name: DMG
        run: |
          app="src/ShiftBridge.MacOS/bin/Release/net10.0-macos/osx-arm64/ShiftBridge.app"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          mkdir -p dmg-root out
          cp -R "$app" dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname ShiftBridge -srcfolder dmg-root -ov -format UDZO out/ShiftBridge-macos-arm64.dmg
          hdiutil verify out/ShiftBridge-macos-arm64.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: ShiftBridge-macos-arm64
          path: out/ShiftBridge-macos-arm64.dmg

      - name: Ajout à la release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" out/ShiftBridge-macos-arm64.dmg --clobber --repo "$GITHUB_REPOSITORY"
